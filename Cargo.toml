[workspace]
resolver = "2"
members = ["crates/journal-core", "crates/journal-cli", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/sjh9714/journal"

[workspace.dependencies]
anyhow = "1.0"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_norway = "0.9"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
uuid = { version = "1.29", features = ["v4"] }
rusqlite = { version = "0.41", features = ["bundled"] }
walkdir = "2.5"
sha2 = "0.11"
dirs = "6.0"
tempfile = "3.27"
rmcp = { version = "3.8", default-features = false, features = ["server", "macros", "transport-io", "schemars"] }
schemars = "1.2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "signal"] }
zip = { version = "9.1", default-features = false, features = ["deflate"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
